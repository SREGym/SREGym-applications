apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose -f docker-compose-no-rpc.yml -o k8s-no-rpc/ -n blueprint-hotel
      convert
    kompose.image-pull-policy: IfNotPresent
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    configmap: rpc
    io.kompose.service: recomd-service
  name: recomd-service

spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: recomd-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose -f docker-compose-no-rpc.yml -o k8s-no-rpc/ -n blueprint-hotel
          convert
        kompose.image-pull-policy: IfNotPresent
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: recomd-service
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: recomd-service-container-env
        - configMapRef:
            name: rpc
        image: ghcr.io/sregym/blueprint-hotel:20260913-recomd@sha256:0c17bad221ab3da5f5273d43a875f893b44f47e00eeb785b7f4de3ca73d20b8a
        imagePullPolicy: IfNotPresent
        name: recomd-service-container
        ports:
        - containerPort: 12345
          protocol: TCP
      hostname: recomd-service
      restartPolicy: Always
