apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: {{ .Values.replicas.api }}
  selector: {matchLabels: {app.kubernetes.io/name: codehub, app.kubernetes.io/component: api}}
  template:
    metadata:
      labels:
        {{- include "codehub.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "codehub.security" . | nindent 8 }}
      {{- include "codehub.placement" . | nindent 6 }}
      containers:
        - name: api
          image: {{ .Values.image.repository | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, codehub.api]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          env:
            {{- include "codehub.env" . | nindent 12 }}
          ports: [{name: http, containerPort: 8080}]
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 90}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          resources:
            {{- toYaml .Values.services.api.resources | nindent 12 }}
          volumeMounts:
            - {name: credentials, mountPath: /run/credentials, readOnly: true}
            - {name: data, mountPath: /var/lib/codehub}
            - {name: tmp, mountPath: /tmp}
            - {name: routes, mountPath: /etc/codehub, readOnly: true}
      volumes:
        - {name: credentials, secret: {secretName: {{ .Values.credentialsSecret }}, defaultMode: 0440}}
        - {name: data, emptyDir: {sizeLimit: 128Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: routes, configMap: {name: database-routes}}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app.kubernetes.io/name: codehub, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8080, targetPort: http}]
