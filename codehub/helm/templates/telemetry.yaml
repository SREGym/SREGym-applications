apiVersion: v1
kind: ConfigMap
metadata: {name: telemetry-config}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http: {endpoint: "0.0.0.0:4318"}
      prometheus:
        config:
          scrape_configs:
            - job_name: queue
              scrape_interval: 15s
              static_configs:
                - targets:
                    - queue-0.queue-headless.{{ .Release.Namespace }}.svc.cluster.local:15692
                    - queue-1.queue-headless.{{ .Release.Namespace }}.svc.cluster.local:15692
                    - queue-2.queue-headless.{{ .Release.Namespace }}.svc.cluster.local:15692
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 192, spike_limit_mib: 32}
      batch: {timeout: 2s, send_batch_size: 256, send_batch_max_size: 512}
      resource:
        attributes:
          - {key: deployment.region, value: {{ .Values.region }}, action: upsert}
    exporters:
      otlp:
        endpoint: {{ .Values.observability.traceEndpoint | quote }}
        tls: {insecure: true}
        sending_queue: {queue_size: 64}
      prometheus:
        endpoint: "0.0.0.0:8889"
        metric_expiration: 5m
    extensions:
      health_check: {endpoint: "0.0.0.0:13133"}
    service:
      extensions: [health_check]
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp]}
        metrics: {receivers: [otlp, prometheus], processors: [memory_limiter, resource, batch], exporters: [prometheus]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: telemetry}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: codehub, app.kubernetes.io/component: telemetry}}
  template:
    metadata:
      labels:
        {{- include "codehub.labels" . | nindent 8 }}
        app.kubernetes.io/component: telemetry
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8889"}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      {{- include "codehub.placement" (dict "root" . "component" "telemetry") | nindent 6 }}
      containers:
        - name: telemetry
          image: {{ .Values.observability.image | quote }}
          args: ["--config=/etc/codehub/collector.yaml"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: otlp-http, containerPort: 4318}, {name: metrics, containerPort: 8889}, {name: health, containerPort: 13133}]
          readinessProbe: {httpGet: {path: /, port: health}, periodSeconds: 3}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 100m, memory: 256Mi}}
          volumeMounts: [{name: config, mountPath: /etc/codehub, readOnly: true}]
      volumes: [{name: config, configMap: {name: telemetry-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: telemetry}
spec:
  selector: {app.kubernetes.io/name: codehub, app.kubernetes.io/component: telemetry}
  ports: [{name: otlp-http, port: 4318, targetPort: otlp-http}, {name: metrics, port: 8889, targetPort: metrics}]
