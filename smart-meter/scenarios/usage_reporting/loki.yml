auth_enabled: false
server:
  http_listen_address: 10.72.0.22
  http_listen_port: 3100
common:
  path_prefix: /var/lib/company/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/company/loki/chunks
      rules_directory: /var/lib/company/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
analytics:
  reporting_enabled: false
