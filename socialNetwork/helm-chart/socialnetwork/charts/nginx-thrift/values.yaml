name: nginx-thrift

ports:
  - port: 8080
    targetPort: 8080

container:
  image: yg397/openresty-thrift
  imageVersion: xenial
  name: nginx-thrift
  ports: 
  - containerPort: 8080
  env:
  - name: fqdn_suffix
    value: ".{{ .Release.Namespace }}.svc.cluster.local"
  volumeMounts:
    - name: lua-scripts
      mountPath: /usr/local/openresty/nginx/lua-scripts
    - name: lua-thrift
      mountPath: /usr/local/openresty/lualib/thrift
    - name: pages
      mountPath: /usr/local/openresty/nginx/pages
    - name: gen-lua
      mountPath: /gen-lua
    - name: keys
      mountPath: /keys


initContainer:
  dockerRegistry: ghcr.io/sregym
  image: social-network-assets
  imageVersion: v1
  name: alpine-container
  volumeMounts:
  - name: lua-scripts
    mountPath: /lua-scripts
  - name: lua-thrift
    mountPath: /lua-thrift
  - name: pages
    mountPath: /pages
  - name: gen-lua
    mountPath: /gen-lua
  - name: keys
    mountPath: /keys
  command: "/bin/sh" 
  args: ["-c", "cp -r /opt/social-network/gen-lua/. /gen-lua/ &&
            cp -r /opt/social-network/lua-thrift/. /lua-thrift/ &&
            cp -r /opt/social-network/nginx/lua-scripts/. /lua-scripts/ &&
            cp -r /opt/social-network/nginx/pages/. /pages/ &&
            cp -r /opt/social-network/keys/. /keys/"]

volumes:
  - name: lua-scripts
  - name: pages
  - name: gen-lua
  - name: lua-thrift
  - name: keys

configMaps:
  - name: jaeger-config.json
    mountPath: /usr/local/openresty/nginx/jaeger-config.json
    value: jaeger-config

  - name: nginx.conf
    mountPath: /usr/local/openresty/nginx/conf/nginx.conf 
    value: nginx
